[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "niche-social-network"
version = "0.1.0"
description = "Esqueleto educativo de API REST con persistencia poliglota"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "neo4j>=5.27,<7",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pymongo>=4.11,<5",
  "redis>=5.2,<7",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
platform = "linux"
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

