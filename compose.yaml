services:
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build: .
    volumes:
      - interaction_locks:/home/appuser/interaction-locks
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: development
      APP_DEMO_MODE: "false"
      MONGODB_URL: mongodb://mongo:27017
      MONGODB_DATABASE: niche_social
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-local_dev_password}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=8)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  mongo:
    image: mongo:8.0
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping: 1})"]
      interval: 10s
      timeout: 5s
      retries: 10

  publication-worker:
    build: .
    command: ["python", "-m", "app.workers.publications"]
    restart: unless-stopped
    volumes:
      - publication_worker_lock:/home/appuser/publication-worker
    environment:
      APP_ENV: development
      MONGODB_URL: mongodb://mongo:27017
      MONGODB_DATABASE: niche_social
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-local_dev_password}
    depends_on:
      api:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  moderation-worker:
    build: .
    command: ["python", "-m", "app.workers.moderation"]
    restart: unless-stopped
    volumes:
      - moderation_worker_lock:/home/appuser/moderation-worker
      - interaction_locks:/home/appuser/interaction-locks
    environment:
      APP_ENV: development
      MONGODB_URL: mongodb://mongo:27017
      MONGODB_DATABASE: niche_social
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-local_dev_password}
    depends_on:
      api:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-local_dev_password}
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1'"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 40s

volumes:
  interaction_locks:
  mongo_data:
  redis_data:
  neo4j_data:
  publication_worker_lock:
  moderation_worker_lock:
